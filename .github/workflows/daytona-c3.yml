# Manual Daytona Linux VM live tests.
# Not on pull_request. Not on push. Burns paid VM time.
# DAYTONA_API_KEY stays in GitHub secrets; never in git, guest env, or logs.
name: daytona-c3

on:
  workflow_dispatch:

concurrency:
  group: daytona-c3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daytona-live:
    name: Daytona VM live test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      FLOK_DAYTONA_SNAPSHOT: ${{ vars.FLOK_DAYTONA_SNAPSHOT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - name: Verify Daytona configuration
        run: |
          test -n "$DAYTONA_API_KEY"
          test -n "$FLOK_DAYTONA_SNAPSHOT"
          echo "Daytona snapshot: $FLOK_DAYTONA_SNAPSHOT"
          echo "DAYTONA_API_KEY length=${#DAYTONA_API_KEY}"
      - name: Run Daytona live tests
        env:
          FLOK_LIVE_DAYTONA_TEST: "1"
        run: npm run test:live:daytona
