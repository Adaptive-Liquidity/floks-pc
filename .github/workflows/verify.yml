# Non-paid verification for Adaptive-Liquidity/floks-pc.
# Does NOT run Daytona live tests or Docker live isolation tests.
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - run: npm run verify
