# Manual paid Runloop Blueprint build for C3B.
# workflow_dispatch only. Burns trial credits. Do not add to PR CI.
# Equivalent to: bash blueprints/runloop-interactive/build.sh
# RUNLOOP_API_KEY stays in GitHub secrets; never in git, guest env, or logs.
name: runloop-blueprint

on:
  workflow_dispatch:

concurrency:
  group: runloop-blueprint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-interactive-blueprint:
    name: Build interactive Blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNLOOP_API_KEY: ${{ secrets.RUNLOOP_API_KEY }}
      FLOK_RUNLOOP_INTERACTIVE_BLUEPRINT: flok-runloop-interactive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - name: Verify Runloop configuration
        run: |
          if [ -z "$RUNLOOP_API_KEY" ]; then
            echo "RUNLOOP_API_KEY is missing (must FAIL, not skip)"
            exit 1
          fi
          echo "Blueprint name flok-runloop-interactive"
      - name: Build interactive Blueprint
        run: bash blueprints/runloop-interactive/build.sh
